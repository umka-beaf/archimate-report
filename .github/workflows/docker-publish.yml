name: Build and publish Docker image

# Intentionally NOT triggered on every push — Archi releases are infrequent
# and a full multi-arch build includes a from-source Tycho/Maven build of
# Archi for linux/arm64 (see docker/patches/ + README "Architectures"), which
# takes several minutes. Publishing is a deliberate, manual act, same as the
# `docker buildx build --push` workflow the maintainer already runs locally.
on:
  workflow_dispatch:
    inputs:
      archi_version:
        description: >
          Archi version to build (e.g. 5.9.0). Leave empty to resolve the
          latest release at build time, same as the local build.
        required: false
        type: string
      project_version:
        description: >
          This repo's own SemVer (docs/VERSIONING.md), e.g. 1.1.0. Leave
          empty for an untagged dev-style build (image still gets :<archi>
          and :latest, just no combined :<archi>-<project> tag).
        required: false
        type: string
      push:
        description: Push the built image to Docker Hub and GHCR
        required: false
        type: boolean
        default: true
  release:
    types: [published]

jobs:
  # Resolves both version numbers once so both matrix legs (amd64/arm64) and
  # the merge job agree on the same values, instead of each re-resolving
  # independently and risking a mismatch mid-run. A GitHub Release publish
  # tags a *project* version (see docs/VERSIONING.md — GitHub Releases carry
  # human-written notes about what changed in this repo's own code, e.g.
  # multi-model support), not an Archi version, so the "release" trigger
  # feeds project_version, and archi_version still falls back to "resolve
  # latest Archi release" like a plain manual dispatch would.
  version:
    runs-on: ubuntu-latest
    outputs:
      archi_version: ${{ steps.resolve.outputs.archi_version }}
      project_version: ${{ steps.resolve.outputs.project_version }}
    steps:
      - name: Resolve versions
        id: resolve
        run: |
          ARCHI_VERSION="${{ github.event.inputs.archi_version }}"
          PROJECT_VERSION="${{ github.event.inputs.project_version }}"
          if [ -z "$PROJECT_VERSION" ] && [ "${{ github.event_name }}" = "release" ]; then
            PROJECT_VERSION="${{ github.event.release.tag_name }}"
            PROJECT_VERSION="${PROJECT_VERSION#v}"
          fi
          if [ -z "$ARCHI_VERSION" ]; then
            ARCHI_VERSION="$(curl -fsS https://api.github.com/repos/archimatetool/archi.io/releases/latest \
              | grep -m1 '"tag_name"' | sed -E 's/.*"([^"]+)".*/\1/')"
          fi
          # archi.io's release tag_name convention flip-flops between dotted
          # (5.10.0) and underscored (5_10_0) across releases (see the
          # matching dual-fallback in docker/Dockerfile's amd64 download
          # step) — normalize to the dotted form here so every downstream consumer
          # (the Docker build-arg, the upstream archimatetool/archi git tag
          # release_<version> used by the arm64 source build, which is always
          # dotted regardless of archi.io's binary release naming) gets a
          # consistent value, regardless of which convention was live when
          # this ran. Previously masked because every manual workflow_dispatch
          # run so far supplied a dotted archi_version explicitly.
          ARCHI_VERSION="$(printf '%s' "$ARCHI_VERSION" | tr '_' '.')"
          echo "archi_version=$ARCHI_VERSION" >> "$GITHUB_OUTPUT"
          echo "project_version=$PROJECT_VERSION" >> "$GITHUB_OUTPUT"

  # Built per-platform on the runner best suited for it: amd64 on the regular
  # (free) ubuntu-latest, arm64 on GitHub's native ubuntu-24.04-arm runner
  # (also free for public repos) — no QEMU. The previous single-job,
  # single-step `docker buildx build --platform linux/amd64,linux/arm64`
  # emulated the arm64 leg's Tycho/Maven build under QEMU on an amd64 runner,
  # which alone took ~24 minutes (see run 33562262412, step "Build and push":
  # 1422s) vs. the ~7-11 min a native arm64 build takes per this project's history.
  # Each leg pushes its image *by digest* only (no tags yet, no manifest
  # list) — the merge job below is what actually creates the multi-arch tags.
  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE || secrets.DOCKERHUB_USERNAME }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          push: ${{ github.event.inputs.push != 'false' }}
          build-args: |
            ARCHI_VERSION=${{ needs.version.outputs.archi_version }}
            PROJECT_VERSION=${{ needs.version.outputs.project_version || '0.0.0-dev' }}
            GIT_REVISION=${{ github.sha }}
          # No tags on purpose — this leg only produces a single-platform
          # image identified by digest. The merge job below is what
          # assembles the real :<version>/:latest tags across both digests.
          outputs: type=image,name=docker.io/${{ env.DOCKERHUB_NAMESPACE }}/archimate-report,push-by-digest=true,name-canonical=true,push=${{ github.event.inputs.push != 'false' }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      - name: Export digest
        if: ${{ github.event.inputs.push != 'false' }}
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: ${{ github.event.inputs.push != 'false' }}
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Assembles the two single-platform digests into one real multi-arch
  # manifest list under the actual :<version>/:latest tags on Docker Hub,
  # then mirrors that finished image into GHCR under identical tags (via a
  # second imagetools call reading from Docker Hub, not by rebuilding) —
  # this is what keeps GHCR tags byte-for-byte synced with Docker Hub, and
  # it's a plain registry-to-registry copy, so it's fast regardless of how
  # long the underlying platform builds took.
  merge:
    needs: [version, build]
    if: ${{ github.event.inputs.push != 'false' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE || secrets.DOCKERHUB_USERNAME }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Three possible tags per registry (docs/VERSIONING.md): :latest always,
      # :<archi> when the Archi version is known, and the pinnable
      # :<archi>-<project> combo when both numbers are known. A project
      # version alone (with no archi tag) isn't published — the combined tag
      # is only meaningful paired with the Archi version it was built against.
      - name: Create and push Docker Hub manifest list
        working-directory: /tmp/digests
        run: |
          ARCHI_VERSION="${{ needs.version.outputs.archi_version }}"
          PROJECT_VERSION="${{ needs.version.outputs.project_version }}"
          REPO="docker.io/${DOCKERHUB_NAMESPACE}/archimate-report"
          TAG_ARGS="-t ${REPO}:latest"
          if [ -n "$ARCHI_VERSION" ]; then
            TAG_ARGS="$TAG_ARGS -t ${REPO}:${ARCHI_VERSION}"
            if [ -n "$PROJECT_VERSION" ]; then
              TAG_ARGS="$TAG_ARGS -t ${REPO}:${ARCHI_VERSION}-${PROJECT_VERSION}"
            fi
          fi
          # shellcheck disable=SC2046
          docker buildx imagetools create $TAG_ARGS \
            $(printf "${REPO}@sha256:%s " *)

      - name: Mirror to GHCR
        run: |
          ARCHI_VERSION="${{ needs.version.outputs.archi_version }}"
          PROJECT_VERSION="${{ needs.version.outputs.project_version }}"
          SRC="docker.io/${DOCKERHUB_NAMESPACE}/archimate-report:latest"
          DEST="ghcr.io/${{ github.repository_owner }}/archimate-report"
          TAG_ARGS="-t ${DEST}:latest"
          if [ -n "$ARCHI_VERSION" ]; then
            TAG_ARGS="$TAG_ARGS -t ${DEST}:${ARCHI_VERSION}"
            if [ -n "$PROJECT_VERSION" ]; then
              TAG_ARGS="$TAG_ARGS -t ${DEST}:${ARCHI_VERSION}-${PROJECT_VERSION}"
            fi
          fi
          # Copies the just-published Docker Hub manifest list straight into
          # GHCR by digest — no rebuild, guarantees the two registries carry
          # byte-identical images under matching tags.
          docker buildx imagetools create $TAG_ARGS "$SRC"

      # Same manual trigger that publishes the image also syncs the Docker
      # Hub repo page's long description from docs/DOCKERHUB.md - one button
      # covers both instead of remembering to separately run
      # docker/scripts/publish-dockerhub-readme.sh by hand with a locally-exported
      # PAT. Reuses the same DOCKERHUB_USERNAME/DOCKERHUB_TOKEN secrets as the
      # login step above.
      - name: Publish Docker Hub README
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          # Kept in sync with the tags above, in case they ever diverge (e.g.
          # publishing under an org whose name differs from the login
          # username).
          DOCKERHUB_NAMESPACE: ${{ env.DOCKERHUB_NAMESPACE }}
        run: ./docker/scripts/publish-dockerhub-readme.sh
