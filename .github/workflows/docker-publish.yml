name: Build and publish Docker image

# Intentionally NOT triggered on every push — Archi releases are infrequent
# and a full multi-arch build includes a from-source Tycho/Maven build of
# Archi for linux/arm64 (see docker/patches/ + README "Architectures"), which
# takes several minutes. Publishing is a deliberate, manual act, same as the
# `docker buildx build --push` workflow the maintainer already runs locally.
on:
  workflow_dispatch:
    inputs:
      archi_version:
        description: >
          Archi version to build (e.g. 5.9.0). Leave empty to resolve the
          latest release at build time, same as the local build.
        required: false
        type: string
      push:
        description: Push the built image to Docker Hub
        required: false
        type: boolean
        default: true
  release:
    types: [published]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      # No project-specific default here on purpose — a fork publishing its
      # own copy under a different Docker Hub account/org only needs to set
      # the DOCKERHUB_NAMESPACE repository variable (Settings -> Secrets and
      # variables -> Actions -> Variables), not edit this workflow file.
      # Falls back to the Docker Hub login username, which is the correct
      # namespace for any personal (non-org) account.
      DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE || secrets.DOCKERHUB_USERNAME }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve version tag and build args
        id: version
        run: |
          VERSION="${{ github.event.inputs.archi_version }}"
          if [ -z "$VERSION" ] && [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
            VERSION="${VERSION#v}"
          fi

          TAGS="${DOCKERHUB_NAMESPACE}/archimate-report:latest"
          BUILD_ARGS=""
          if [ -n "$VERSION" ]; then
            TAGS="$TAGS
          ${DOCKERHUB_NAMESPACE}/archimate-report:$VERSION"
            BUILD_ARGS="ARCHI_VERSION=$VERSION"
          fi

          {
            echo "tags<<EOF"
            echo "$TAGS"
            echo "EOF"
            echo "build_args<<EOF"
            echo "$BUILD_ARGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event.inputs.push != 'false' }}
          build-args: ${{ steps.version.outputs.build_args }}
          tags: ${{ steps.version.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Same manual trigger that publishes the image also syncs the Docker
      # Hub repo page's long description from docs/DOCKERHUB.md - one button
      # covers both instead of remembering to separately run
      # docker/publish-dockerhub-readme.sh by hand with a locally-exported
      # PAT. Skipped on dry runs (push=false) since there's nothing new to
      # describe if the image itself wasn't published. Reuses the same
      # DOCKERHUB_USERNAME/DOCKERHUB_TOKEN secrets as the login step above.
      - name: Publish Docker Hub README
        if: ${{ github.event.inputs.push != 'false' }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          # Kept in sync with the build step's tags above, in case they ever
          # diverge (e.g. publishing under an org whose name differs from the
          # login username).
          DOCKERHUB_NAMESPACE: ${{ env.DOCKERHUB_NAMESPACE }}
        run: ./docker/publish-dockerhub-readme.sh
