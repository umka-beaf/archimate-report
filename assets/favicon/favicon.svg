<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="archimate-report">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="node" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>

  <rect width="128" height="128" rx="30" fill="url(#bg)"/>

  <!-- same three-node mark as assets/logo.svg, recentered/rescaled into a square -->
  <g transform="translate(24,16)" stroke="#64748b" stroke-width="3.2" fill="none">
    <line x1="16" y1="16" x2="52" y2="52"/>
    <line x1="52" y1="52" x2="16" y2="80"/>
  </g>
  <g transform="translate(24,16)">
    <rect x="2" y="2" width="28" height="28" rx="7" fill="url(#node)"/>
    <rect x="38" y="38" width="28" height="28" rx="7" fill="url(#node)" opacity="0.85"/>
    <rect x="2" y="66" width="28" height="28" rx="7" fill="url(#node)" opacity="0.7"/>
  </g>
</svg>
