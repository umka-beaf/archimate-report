<svg xmlns="http://www.w3.org/2000/svg" width="680" height="150" viewBox="0 0 680 150" role="img" aria-label="archimate-report">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="node" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>

  <rect width="680" height="150" rx="18" fill="url(#bg)"/>

  <!-- mark: three connected nodes, a nod to an ArchiMate relationship diagram -->
  <g transform="translate(34,34)" stroke="#475569" stroke-width="2.5" fill="none">
    <line x1="20" y1="20" x2="60" y2="62"/>
    <line x1="60" y1="62" x2="20" y2="84"/>
  </g>
  <g transform="translate(34,34)">
    <rect x="4" y="4" width="32" height="32" rx="7" fill="url(#node)"/>
    <rect x="46" y="46" width="32" height="32" rx="7" fill="url(#node)" opacity="0.85"/>
    <rect x="4" y="68" width="32" height="32" rx="7" fill="url(#node)" opacity="0.7"/>
  </g>

  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="150" y="75" font-size="34" font-weight="600" fill="#f1f5f9">archimate-report</text>
    <text x="150" y="100" font-size="15" fill="#94a3b8">git model → HTML report → served, live, multi-arch</text>
  </g>
</svg>
